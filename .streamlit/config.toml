[theme]
base = "dark"
primaryColor = "#d9708f"
backgroundColor = "#121014"
secondaryBackgroundColor = "#1b181d"
textColor = "#ece7ee"
font = "sans serif"

[client]
toolbarMode = "viewer"
# display-only release: no CSV download / clipboard copy from tables
disableDataExport = true

[browser]
gatherUsageStats = false
